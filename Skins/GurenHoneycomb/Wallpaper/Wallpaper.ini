; One full-screen wallpaper shared by all icons. It starts hidden; an icon's
; hover sets the image and fades it in (see @Resources\IconWallpaper.inc).
; FadeDuration is how long the fade takes, in milliseconds.

[Rainmeter]
Update=-1
FadeDuration=800
OnRefreshAction=[!ZPos -2][!Hide]

[Image]
Meter=Image
W=#SCREENAREAWIDTH#
H=#SCREENAREAHEIGHT#
PreserveAspectRatio=2
