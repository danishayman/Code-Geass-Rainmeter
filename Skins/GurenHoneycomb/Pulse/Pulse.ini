; A soft glow behind the sigil that pulses with whatever is playing, using Rainmeter's
; AudioLevel plugin. It follows the bass (the beat) plus a little overall loudness, and
; fades away when the sound stops. Turn it on or off from the sigil's right-click menu.

[Rainmeter]
Update=33
Group=Geass
OnRefreshAction=[!ZPos -2]

[Variables]
; Brightest the glow gets, from 0 to 255.
MaxAlpha=180
; Bass level that gives a full pulse, and loudness that gives a full steady glow.
; Lower numbers make it react more strongly.
FullBass=0.3
FullLoudness=0.04

[Audio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
RMSAttack=30
RMSDecay=250
FFTSize=2048
FFTOverlap=1024
FFTAttack=30
FFTDecay=250
Bands=4
FreqMin=40
FreqMax=160

[Loudness]
Measure=Plugin
Plugin=AudioLevel
Parent=Audio
Type=RMS
Channel=Avg

[Bass1]
Measure=Plugin
Plugin=AudioLevel
Parent=Audio
Type=Band
BandIdx=0

[Bass2]
Measure=Plugin
Plugin=AudioLevel
Parent=Audio
Type=Band
BandIdx=1

[Level]
Measure=Calc
; 0 to 1: mostly the beat, plus some loudness so it doesn't go dark between beats.
Formula=Clamp(0.75 * Clamp(Max(Bass1, Bass2) / #FullBass#, 0, 1) + 0.25 * Clamp(Loudness / #FullLoudness#, 0, 1), 0, 1)

[Smoothed]
Measure=Calc
; Rises quickly on each beat, then fades out over about half a second.
Formula=Level > Smoothed ? Smoothed + (Level - Smoothed) * 0.5 : Smoothed + (Level - Smoothed) * 0.2

[Alpha]
Measure=Calc
Formula=Round(Smoothed * #MaxAlpha#)

[Glow]
Meter=Image
ImageName=#@#Images\glow.png
H=508
ImageAlpha=[Alpha:0]
DynamicVariables=1
