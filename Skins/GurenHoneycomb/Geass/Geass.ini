[Rainmeter]
Update=-1
Group=Geass
OnRefreshAction=[!CommandMeasure Intro "Execute 1"]
OnWakeAction=[!CommandMeasure Intro "Execute 1"]
; The power menu a middle-click on the sigil opens.
ContextTitle=Lock
ContextAction=[%windir%\System32\rundll32.exe user32.dll,LockWorkStation]
ContextTitle2=Sleep
ContextAction2=[%windir%\System32\rundll32.exe powrprof.dll,SetSuspendState]
ContextTitle3=Restart
ContextAction3=[%windir%\System32\shutdown.exe -r -t 0]
ContextTitle4=Shut down
ContextAction4=[%windir%\System32\shutdown.exe -s -t 0]

[Variables]
; How long the icons stay without being used before they fade away, in milliseconds.
AutoHideDelay=15000
LogoAlpha=0
GlowAlpha=255
FlashAlpha=255
; How much one scroll-wheel notch over the sigil changes the volume, in percent.
VolumeStep=2
ShowLevel=[!ActivateConfig "GurenHoneycomb\Glow"][!UpdateMeasure Volume][!UpdateMeasure VolumeAlpha][!UpdateMeasure ShowVolume][!CommandMeasure ShowVolume "Stop 1"][!CommandMeasure ShowVolume "Execute 1"]
; Right-click state, see [RightClick].
RightArmed=0
RightSuppress=0
; Glow brightness during the dip that signals a mute, see [MuteDip].
DipAlpha=255

; When the skin loads or the PC wakes, the sigil and its glow fade in together over
; about a second, so it looks like the usual hover glow from the start. The glow then
; dims away, reaching zero as the last icons finish fading in (see
; @Resources\IconIntro.inc).
[Intro]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Reset | Repeat FadeIn,40,25 | Done | Repeat GlowDim,40,10 | GlowOff | StartAutoHide
Reset=[!SetVariable LogoAlpha 0][!UpdateMeasure Intro][!UpdateMeter Logo][!Redraw][!ActivateConfig "GurenHoneycomb\Glow"][!SetOption Glow ImageAlpha 0 "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
FadeIn=[!SetVariable LogoAlpha "(Clamp(#LogoAlpha#+11,0,255))"][!UpdateMeasure Intro][!UpdateMeter Logo][!Redraw][!SetOption Glow ImageAlpha #LogoAlpha# "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
Done=[!SetVariable LogoAlpha 255][!SetVariable GlowAlpha 255][!UpdateMeasure Intro][!UpdateMeter Logo][!Redraw]
GlowDim=[!SetVariable GlowAlpha "(Clamp(#GlowAlpha#-26,0,255))"][!UpdateMeasure Intro][!SetOption Glow ImageAlpha #GlowAlpha# "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
GlowOff=[!DeactivateConfig "GurenHoneycomb\Glow"]
StartAutoHide=[!CommandMeasure AutoHide "Stop 1"][!CommandMeasure AutoHide "Execute 1"]
DynamicVariables=1

; The icons fade away on their own when they haven't been used for AutoHideDelay ms.
; The timer starts when the sigil is clicked and when the startup intro finishes;
; hovering an icon pauses it, and moving off an icon starts it again (see the icon
; templates in @Resources).
[AutoHide]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait #AutoHideDelay# | Hide
Hide=[!HideFadeGroup "Honey"]

; Scrolling over the sigil changes the system volume. While you scroll, the glow's
; brightness shows the volume, and 1.2 seconds after you stop it goes back to normal.
[Volume]
Measure=Plugin
Plugin=Win7AudioPlugin

[VolumeAlpha]
Measure=Calc
; 40 at 0%, up to 255 at 100%, and full while muted (the Volume measure reads -1).
Formula=(Volume < 0) ? 255 : Round(40 + Clamp(Volume, 0, 100) * 2.15)

[ShowVolume]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Show | Wait 1200 | Restore
Show=[!SetOption Glow ImageAlpha [VolumeAlpha:0] "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
Restore=[!SetOption Glow ImageAlpha 255 "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
DynamicVariables=1

; Muting gives one brief dip as a signal: the glow fades down and straight back up. The
; glow stays full while muted, and unmuting leaves it as it is. [MuteFlip] checks the
; mute just before the toggle (the Volume measure reads -1 while muted), because right
; after a toggle the reading is briefly out of date. It's only switched on for that
; check, so loading the skin never starts a dip.
[MuteFlip]
Measure=Calc
Formula=Volume
Disabled=1
IfCondition=MuteFlip >= 0
IfTrueAction=[!CommandMeasure MuteDip "Stop 1"][!CommandMeasure MuteDip "Execute 1"]
IfConditionMode=1

[MuteDip]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Start | Repeat Down,25,8 | Repeat Up,25,8 | Full
Start=[!SetVariable DipAlpha 255][!UpdateMeasure MuteDip]
Down=[!SetVariable DipAlpha "(Clamp(#DipAlpha#-23,70,255))"][!UpdateMeasure MuteDip][!SetOption Glow ImageAlpha #DipAlpha# "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
Up=[!SetVariable DipAlpha "(Clamp(#DipAlpha#+23,70,255))"][!UpdateMeasure MuteDip][!SetOption Glow ImageAlpha #DipAlpha# "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
Full=[!SetVariable DipAlpha 255][!UpdateMeasure MuteDip][!SetOption Glow ImageAlpha 255 "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
DynamicVariables=1

; A single right-click on the sigil mutes or unmutes (muting dips the glow, see
; [MuteDip]). A double right-click switches the sound to the next output that's
; turned on in Windows' Sound settings instead. Each right-click arms a mute that goes
; off after 400 ms; a double-click marks that mute as cancelled, so only one of the two
; happens. Rainmeter's own menu is on Ctrl+right-click.
[RightClick]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 400 | Decide
Decide=[!UpdateMeasure MuteGate][!SetVariable RightArmed 0][!SetVariable RightSuppress 0]
DynamicVariables=1

[MuteGate]
Measure=Calc
Formula=#RightArmed# * (1 - #RightSuppress#)
DynamicVariables=1
UpdateDivider=-1
IfCondition=MuteGate = 1
IfTrueAction=[!ActivateConfig "GurenHoneycomb\Glow"][!UpdateMeasure Volume][!EnableMeasure MuteFlip][!UpdateMeasure MuteFlip][!DisableMeasure MuteFlip][!CommandMeasure Volume "ToggleMute"]
IfConditionMode=1

; The glow dips and rises again to confirm an output switch.
[Flash]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Dip | Repeat Rise,30,8 | Full
Dip=[!SetVariable FlashAlpha 40][!UpdateMeasure Flash][!ActivateConfig "GurenHoneycomb\Glow"][!SetOption Glow ImageAlpha 40 "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
Rise=[!SetVariable FlashAlpha "(Clamp(#FlashAlpha#+27,0,255))"][!UpdateMeasure Flash][!SetOption Glow ImageAlpha #FlashAlpha# "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
Full=[!SetOption Glow ImageAlpha 255 "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
DynamicVariables=1

[Logo]
Meter=Image
ImageName=#@#Images\geass.png
H=450
ImageAlpha=#LogoAlpha#
DynamicVariables=1
LeftMouseUpAction=[!ToggleFadeGroup "Honey"][!CommandMeasure AutoHide "Stop 1"][!CommandMeasure AutoHide "Execute 1"]
MiddleMouseUpAction=[!SkinCustomMenu]
RightMouseUpAction=[!SetVariable RightArmed 1][!CommandMeasure RightClick "Stop 1"][!CommandMeasure RightClick "Execute 1"]
RightMouseDoubleClickAction=[!SetVariable RightSuppress 1][!CommandMeasure Volume "ToggleNext"][!CommandMeasure ShowVolume "Stop 1"][!CommandMeasure Flash "Stop 1"][!CommandMeasure Flash "Execute 1"]
MouseOverAction=[!ActivateConfig "GurenHoneycomb\Glow"]
MouseLeaveAction=[!CommandMeasure ShowVolume "Stop 1"][!CommandMeasure Flash "Stop 1"][!CommandMeasure MuteDip "Stop 1"][!DeactivateConfig "GurenHoneycomb\Glow"]
MouseScrollUpAction=[!CommandMeasure Volume "ChangeVolume #VolumeStep#"]#ShowLevel#
MouseScrollDownAction=[!CommandMeasure Volume "ChangeVolume -#VolumeStep#"]#ShowLevel#
