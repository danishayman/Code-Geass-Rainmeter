[Rainmeter]
Update=-1
Group=Geass
OnRefreshAction=[!CommandMeasure Intro "Execute 1"]
OnWakeAction=[!CommandMeasure Intro "Execute 1"]
ContextTitle=Load monitor layout
ContextAction=[!LoadLayout "MonitorLayout"]
ContextTitle2=Load laptop layout
ContextAction2=[!LoadLayout "LaptopLayout"]
ContextTitle3=Turn music glow on or off
ContextAction3=[!ToggleConfig "GurenHoneycomb\Pulse" "Pulse.ini"]

[Variables]
LogoAlpha=0

; When the skin loads or the PC wakes, the sigil fades in over about a second and
; glows until the icons have faded in (see @Resources\IconIntro.inc).
[Intro]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Reset | Repeat FadeIn,40,17 | GlowOn | Repeat FadeIn,40,8 | Done | Wait 1300 | GlowOff
Reset=[!SetVariable LogoAlpha 0][!UpdateMeasure Intro][!UpdateMeter Logo][!Redraw]
FadeIn=[!SetVariable LogoAlpha "(Clamp(#LogoAlpha#+11,0,255))"][!UpdateMeasure Intro][!UpdateMeter Logo][!Redraw]
GlowOn=[!ActivateConfig "GurenHoneycomb\Glow"]
Done=[!SetVariable LogoAlpha 255][!UpdateMeasure Intro][!UpdateMeter Logo][!Redraw]
GlowOff=[!DeactivateConfig "GurenHoneycomb\Glow"]
DynamicVariables=1

[Logo]
Meter=Image
ImageName=#@#Images\geass.png
H=450
ImageAlpha=#LogoAlpha#
DynamicVariables=1
LeftMouseUpAction=[!ToggleFadeGroup "Honey"]
MouseOverAction=[!ActivateConfig "GurenHoneycomb\Glow"]
MouseLeaveAction=[!DeactivateConfig "GurenHoneycomb\Glow"]
