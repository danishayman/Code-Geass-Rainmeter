[Rainmeter]
Update=-1
Group=Geass
OnRefreshAction=[!CommandMeasure Intro "Execute 1"]
OnWakeAction=[!CommandMeasure Intro "Execute 1"]
; The power menu a middle-click on the sigil opens.
ContextTitle=Lock
ContextAction=[%windir%\System32\rundll32.exe user32.dll,LockWorkStation]
ContextTitle2=Sleep
ContextAction2=[%windir%\System32\rundll32.exe powrprof.dll,SetSuspendState]
ContextTitle3=Restart
ContextAction3=[%windir%\System32\shutdown.exe -r -t 0]
ContextTitle4=Shut down
ContextAction4=[%windir%\System32\shutdown.exe -s -t 0]

[Variables]
LogoAlpha=0
GlowAlpha=255
FlashAlpha=255
; How much one scroll-wheel notch over the sigil changes the volume, in percent.
VolumeStep=2
ShowLevel=[!ActivateConfig "GurenHoneycomb\Glow"][!UpdateMeasure Volume][!UpdateMeasure VolumeAlpha][!UpdateMeasure ShowVolume][!CommandMeasure ShowVolume "Stop 1"][!CommandMeasure ShowVolume "Execute 1"]

; When the skin loads or the PC wakes, the sigil and its glow fade in together over
; about a second, so it looks like the usual hover glow from the start. The glow then
; dims away, reaching zero as the last icons finish fading in (see
; @Resources\IconIntro.inc).
[Intro]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Reset | Repeat FadeIn,40,25 | Done | Repeat GlowDim,40,10 | GlowOff
Reset=[!SetVariable LogoAlpha 0][!UpdateMeasure Intro][!UpdateMeter Logo][!Redraw][!ActivateConfig "GurenHoneycomb\Glow"][!SetOption Glow ImageAlpha 0 "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
FadeIn=[!SetVariable LogoAlpha "(Clamp(#LogoAlpha#+11,0,255))"][!UpdateMeasure Intro][!UpdateMeter Logo][!Redraw][!SetOption Glow ImageAlpha #LogoAlpha# "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
Done=[!SetVariable LogoAlpha 255][!SetVariable GlowAlpha 255][!UpdateMeasure Intro][!UpdateMeter Logo][!Redraw]
GlowDim=[!SetVariable GlowAlpha "(Clamp(#GlowAlpha#-26,0,255))"][!UpdateMeasure Intro][!SetOption Glow ImageAlpha #GlowAlpha# "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
GlowOff=[!DeactivateConfig "GurenHoneycomb\Glow"]
DynamicVariables=1

; Scrolling over the sigil changes the system volume. While you scroll, the glow's
; brightness shows the volume, and 1.2 seconds after you stop it goes back to normal.
[Volume]
Measure=Plugin
Plugin=Win7AudioPlugin

[VolumeAlpha]
Measure=Calc
; 40 at 0% (or muted), up to 255 at 100%.
Formula=Round(40 + Clamp(Volume, 0, 100) * 2.15)

[ShowVolume]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Show | Wait 1200 | Restore
Show=[!SetOption Glow ImageAlpha [VolumeAlpha:0] "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
Restore=[!SetOption Glow ImageAlpha 255 "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
DynamicVariables=1

; Double right-clicking the sigil switches the sound to the next output that's turned on
; in Windows' Sound settings, and the glow dips and rises again to confirm. A single
; right-click does nothing, so Rainmeter's menu can't interrupt the double-click; the
; menu is on Ctrl+right-click.
[Flash]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Dip | Repeat Rise,30,8 | Full
Dip=[!SetVariable FlashAlpha 40][!UpdateMeasure Flash][!ActivateConfig "GurenHoneycomb\Glow"][!SetOption Glow ImageAlpha 40 "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
Rise=[!SetVariable FlashAlpha "(Clamp(#FlashAlpha#+27,0,255))"][!UpdateMeasure Flash][!SetOption Glow ImageAlpha #FlashAlpha# "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
Full=[!SetOption Glow ImageAlpha 255 "GurenHoneycomb\Glow"][!UpdateMeter Glow "GurenHoneycomb\Glow"][!Redraw "GurenHoneycomb\Glow"]
DynamicVariables=1

[Logo]
Meter=Image
ImageName=#@#Images\geass.png
H=450
ImageAlpha=#LogoAlpha#
DynamicVariables=1
LeftMouseUpAction=[!ToggleFadeGroup "Honey"]
MiddleMouseUpAction=[!SkinCustomMenu]
RightMouseUpAction=[!Redraw]
RightMouseDoubleClickAction=[!CommandMeasure Volume "ToggleNext"][!CommandMeasure ShowVolume "Stop 1"][!CommandMeasure Flash "Stop 1"][!CommandMeasure Flash "Execute 1"]
MouseOverAction=[!ActivateConfig "GurenHoneycomb\Glow"]
MouseLeaveAction=[!CommandMeasure ShowVolume "Stop 1"][!CommandMeasure Flash "Stop 1"][!DeactivateConfig "GurenHoneycomb\Glow"]
MouseScrollUpAction=[!CommandMeasure Volume "ChangeVolume #VolumeStep#"]#ShowLevel#
MouseScrollDownAction=[!CommandMeasure Volume "ChangeVolume -#VolumeStep#"]#ShowLevel#
