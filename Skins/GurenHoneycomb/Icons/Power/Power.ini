; Click: hide the icons. Double-click: sleep. Middle double-click: shut down.
; Right double-click: restart.

[Rainmeter]
Update=-1
Group=Honey
OnRefreshAction=[!Hide][!CommandMeasure Intro "Execute 1"]
OnWakeAction=[!Hide][!CommandMeasure Intro "Execute 1"]

[Icon]
Meter=Image
ImageName=#@#Images\Icons\power.png
H=90
LeftMouseUpAction=[!Delay 500][!HideFadeGroup "Honey"]
LeftMouseDoubleClickAction=[%windir%\System32\rundll32.exe powrprof.dll,SetSuspendState]
MiddleMouseDoubleClickAction=[%windir%\System32\shutdown.exe -s -t 00]
RightMouseDoubleClickAction=[%windir%\System32\shutdown.exe -r -t 00]
@IncludeIntro=#@#IconIntro.inc
