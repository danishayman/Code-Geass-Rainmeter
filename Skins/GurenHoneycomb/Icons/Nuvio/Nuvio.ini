[Variables]
Icon=nuvio
; A click runs Focus.ps1, which brings Nuvio's window back if it's already open,
; or starts Nuvio if it isn't running.
Launch=[!CommandMeasure Focus "Run"]
StartMenuName=Nuvio
Wallpaper=Nuvio
@Include=#@#IconWallpaper.inc

[Focus]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Focus.ps1" -Process Nuvio -Launch "shell:AppsFolder\{6D809377-6AF0-444B-8957-A3773F02200E}\Nuvio\Nuvio.exe"
State=Hide
