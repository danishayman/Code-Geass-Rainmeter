[Variables]
Icon=discord
; Discord ignores a second launch while it's minimized, so a click runs Focus.ps1,
; which brings its window back, or starts Discord if it isn't running.
Launch=[!CommandMeasure Focus "Run"]
StartMenuName=Discord
Wallpaper=Discord
@Include=#@#IconWallpaper.inc

[Focus]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Focus.ps1" -Process Discord -Launch "shell:AppsFolder\com.squirrel.Discord.Discord"
State=Hide
